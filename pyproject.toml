[project]
name = "gitupdater"
version = "1.0.0"
description = "Ansible module for the git-repo-updater (gitup)."
authors = [{ name = "Josef Friedrich", email = "josef@friedrich.rocks" }]
requires-python = ">=3.12,<4"
readme = "README.rst"
license = "GPL-3.0-only"
classifiers = [
    "Private :: Do not Upload",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "ansible>=13.2.0",
    "gitup",
]

[project.urls]
Repository = "https://github.com/Josef-Friedrich/ansible-module-gitupdater"

[tool.uv.sources]
gitup = { git = "https://github.com/earwig/git-repo-updater.git" }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[build-system]
requires = ["uv_build>=0.8.10,<0.9.0"]
build-backend = "uv_build"


[tool.uv.build-backend]
module-name = "gitupdater"
module-root = ""
namespace = true
